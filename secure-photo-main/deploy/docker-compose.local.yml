services:
  server:
    build:
      context: ../server
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data
      REGISTRATION_SECRET: ${REGISTRATION_SECRET:?set REGISTRATION_SECRET}
      MAX_ROOMS: ${MAX_ROOMS:-1}
      ALLOWED_ORIGIN: http://localhost
    volumes:
      - secure_photo_data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ../web:/srv/web:ro
    depends_on:
      server:
        condition: service_healthy

volumes:
  secure_photo_data:
